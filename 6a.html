<!DOCTYPE html>
<html lang="ru">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; }
        
        body { background: #0b0b0b; background-image: radial-gradient(circle at 10% 20%, #1e1a0f 0%, #0a0705 90%); color: #e6e6e6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; overflow-x: hidden; transition: background 0.8s, color 0.5s; }
        
        /* 👻 Призрачный ивент */
        body.ghost-active {
            background: #121212;
            background-image: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #0a0a0a 90%);
            color: #d0e0ff;
        }
        body.ghost-active::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, rgba(136, 204, 255, 0.08) 0%, transparent 70%);
            animation: ghostPulse 4s infinite alternate;
        }
        @keyframes ghostPulse {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }
        body.ghost-active .container {
            background: rgba(20, 20, 25, 0.92);
            border-color: #88ccff;
            box-shadow: 0 0 40px #88ccff66, 0 0 20px #88ccff inset;
            animation: ghostContainerGlow 3s infinite alternate;
        }
        @keyframes ghostContainerGlow {
            0% { box-shadow: 0 0 25px #88ccff44, 0 0 15px #88ccff inset; }
            100% { box-shadow: 0 0 55px #88ccffaa, 0 0 25px #88ccff inset; }
        }
        
        /* Заменяем мышек на призраков */
        body.ghost-active .bat { display: none !important; }
        body.ghost-active .ghost-decor { display: block !important; }

            display: none;
            position: fixed;
            color: #88ccff;
            font-size: 2rem;

        .ghost-decor.g3 { top: 60%; right: 12%; animation-duration: 14s; font-size: 2.4rem; animation-delay: -7s; }
        
        body.ghost-active .spider-web svg {
            filter: drop-shadow(0 0 8px #88ccff);
            opacity: 0.4;
        }

        /* 🌈 Радужный фон */
